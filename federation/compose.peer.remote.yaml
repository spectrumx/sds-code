# Sync-only peer on a remote host (no gateway / Postgres).
# Pair with federation.peer.remote.toml and docs/peer-remote-test.md.
#
# On the peer machine (sds-fed1):
#   cd ../network && just up    # Traefik + sds-network-local
#   cd ../federation
#   cp federation.peer.remote.example.toml federation.peer.toml
#   cp env.peer.example .env.peer
#   docker compose -f compose.peer.remote.yaml --env-file .env.peer up -d --build
#
# Main site (sds-dev) must list this peer's public sync URL in federation.toml [[peers]].

networks:
  peer-internal:
    driver: bridge
  sds-network-local:
    external: true
    name: sds-network-local

services:
  sds-federation-peer-opensearch:
    image: opensearchproject/opensearch:2
    container_name: sds-federation-peer-opensearch
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ports:
      # Host loopback only — seed_peer_opensearch.py. Not for peer sync.
      - "127.0.0.1:${PEER_OPENSEARCH_PORT:-9200}:9200"
    networks: [peer-internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s

  sds-federation-peer-redis:
    image: redis:6
    container_name: sds-federation-peer-redis
    networks: [peer-internal]

  sds-federation-peer-sync:
    build:
      context: ..
      dockerfile: federation/Dockerfile
    image: sds-federation-peer-sync
    container_name: sds-federation-peer-sync
    environment:
      FEDERATION_CONFIG_PATH: /etc/sds/federation.toml
      # Must be reachable by the main site (set in toml sync_service_url too).
      FEDERATION_SYNC_SERVICE_URL: ${PEER_SYNC_PUBLIC_URL:-https://sds-fed1.crc.nd.edu/sync}
      # Intentional: sync-only peer has no gateway export.
      GATEWAY_INTERNAL_BASE_URL: http://127.0.0.1:9/api/v1
      REDIS_URL: redis://sds-federation-peer-redis:6379/0
      OPENSEARCH_HOST: sds-federation-peer-opensearch
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_USER: ""
      OPENSEARCH_PASSWORD: ""
      OPENSEARCH_USE_SSL: "false"
      OPENSEARCH_VERIFY_CERTS: "false"
      FEDERATION_SITE_NAME: ${PEER_SITE_NAME:-fed1}
      FEDERATION_BOOTSTRAP_ON_START: ${FEDERATION_BOOTSTRAP_ON_START:-true}
    volumes:
      - ./federation.peer.toml:/etc/sds/federation.toml:ro
      - ./certs:/etc/sds/certs:ro
    depends_on:
      sds-federation-peer-opensearch:
        condition: service_healthy
      sds-federation-peer-redis:
        condition: service_started
    networks:
      - peer-internal
      - sds-network-local
